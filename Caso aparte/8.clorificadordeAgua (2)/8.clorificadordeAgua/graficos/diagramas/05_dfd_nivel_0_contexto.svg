<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra suave estilo Notion / Stripe -->
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="centerShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.18"/>
    </filter>

    <!-- Marcadores de flecha limpios para DFD -->
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1.5 1.5 L 7.5 4.5 L 1.5 7.5 Z" fill="#0284C7"/>
    </marker>
  </defs>

  <style>
    .font-title { font-family: 'Montserrat', system-ui, -apple-system, sans-serif; font-weight: 800; }
    .font-sub { font-family: 'Montserrat', system-ui, -apple-system, sans-serif; font-weight: 700; }
    .font-body { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 400; }
    .font-mono { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
  </style>

  <!-- Fondo Limpio y Suave -->
  <rect width="1440" height="960" fill="#F8FAFC"/>

  <!-- ========================================================================
       CABECERA TIPO NOTION / STRIPE
       ======================================================================== -->
  <g transform="translate(50, 25)">
    <rect x="0" y="0" width="1340" height="80" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow)"/>
    <path d="M 0 14 Q 0 0 14 0 L 14 80 Q 0 80 0 66 Z" fill="#0284C7"/>

    <text x="35" y="35" class="font-title" font-size="18" fill="#0F172A" letter-spacing="0.3">DIAGRAMA DE FLUJO DE DATOS (DFD) — NIVEL 0: CONTEXTO DEL SISTEMA</text>
    <text x="35" y="58" class="font-body" font-size="12" fill="#64748B">
      Límites del Sistema Ciberfísico, Entidades Externas y Flujos de Entrada/Salida • <tspan class="font-sub" fill="#0F172A">HydroVidrial 2026</tspan>
    </text>

    <!-- Badge Autores & Estándar -->
    <rect x="940" y="21" width="375" height="38" rx="8" fill="#F0F9FF"/>
    <text x="955" y="44" class="font-body" font-size="11.5" fill="#0369A1">
      <tspan class="font-sub" fill="#0284C7">Yourdon &amp; DeMarco</tspan> • EBT: Roxana • Andrea • Camilo
    </text>
  </g>

  <!-- ========================================================================
       ENTIDADES EXTERNAS (CARDS MODERNOS DE ALTO CONTRASTE)
       ======================================================================== -->
  <!-- EE-1: Operador Comunitario JAC (Izquierda Arriba) -->
  <g transform="translate(60, 150)">
    <rect x="0" y="0" width="280" height="135" rx="12" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5" filter="url(#softShadow)"/>
    <path d="M 0 12 Q 0 0 12 0 L 12 135 Q 0 135 0 123 Z" fill="#10B981"/>
    
    <rect x="22" y="14" width="135" height="22" rx="5" fill="#ECFDF5"/>
    <text x="30" y="29" class="font-sub" font-size="9" fill="#047857">ENTIDAD EXTERNA 1</text>
    
    <text x="22" y="58" class="font-title" font-size="13" fill="#064E3B">Operador Comunal JAC</text>
    <text x="22" y="80" class="font-body" font-size="11" fill="#475569">Personal veredal certificado de El Vidrial.</text>
    <text x="22" y="98" class="font-body" font-size="11" fill="#475569">Captura lecturas de aforo y tiras DPD.</text>
    <text x="22" y="118" class="font-mono" font-size="9.5" fill="#059669">[Rol de Campo • App HydroVidrial]</text>
  </g>

  <!-- EE-2: Familias Beneficiarias (Izquierda Abajo) -->
  <g transform="translate(60, 560)">
    <rect x="0" y="0" width="280" height="135" rx="12" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5" filter="url(#softShadow)"/>
    <path d="M 0 12 Q 0 0 12 0 L 12 135 Q 0 135 0 123 Z" fill="#F59E0B"/>

    <rect x="22" y="14" width="135" height="22" rx="5" fill="#FFFBEB"/>
    <text x="30" y="29" class="font-sub" font-size="9" fill="#B45309">ENTIDAD EXTERNA 2</text>
    
    <text x="22" y="58" class="font-title" font-size="13" fill="#78350F">Comunidad de Familias</text>
    <text x="22" y="80" class="font-body" font-size="11" fill="#475569">140 hogares rurales en El Vidrial.</text>
    <text x="22" y="98" class="font-body" font-size="11" fill="#475569">Consumo de agua potable en red comunitaria.</text>
    <text x="22" y="118" class="font-mono" font-size="9.5" fill="#D97706">[Receptores de Boletín y Alertas]</text>
  </g>

  <!-- EE-3: Equipo de Ingeniería EBT / UPB (Derecha Arriba) -->
  <g transform="translate(1100, 150)">
    <rect x="0" y="0" width="280" height="135" rx="12" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5" filter="url(#softShadow)"/>
    <path d="M 0 12 Q 0 0 12 0 L 12 135 Q 0 135 0 123 Z" fill="#6366F1"/>

    <rect x="22" y="14" width="135" height="22" rx="5" fill="#EEF2FF"/>
    <text x="30" y="29" class="font-sub" font-size="9" fill="#4338CA">ENTIDAD EXTERNA 3</text>
    
    <text x="22" y="58" class="font-title" font-size="13" fill="#312E81">Ingeniería EBT &amp; SILOGE</text>
    <text x="22" y="80" class="font-body" font-size="11" fill="#475569">Facultad de Ingeniería Industrial UPB.</text>
    <text x="22" y="98" class="font-body" font-size="11" fill="#475569">Ajuste de parámetros cinéticos y ROI.</text>
    <text x="22" y="118" class="font-mono" font-size="9.5" fill="#4F46E5">[Supervisión Científica y Metrológica]</text>
  </g>

  <!-- EE-4: Secretaría de Salud Municipal (Derecha Abajo) -->
  <g transform="translate(1100, 560)">
    <rect x="0" y="0" width="280" height="135" rx="12" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.5" filter="url(#softShadow)"/>
    <path d="M 0 12 Q 0 0 12 0 L 12 135 Q 0 135 0 123 Z" fill="#F43F5E"/>

    <rect x="22" y="14" width="135" height="22" rx="5" fill="#FFF1F2"/>
    <text x="30" y="29" class="font-sub" font-size="9" fill="#9F1239">ENTIDAD EXTERNA 4</text>
    
    <text x="22" y="58" class="font-title" font-size="13" fill="#881337">Secretaría de Salud Mpal.</text>
    <text x="22" y="80" class="font-body" font-size="11" fill="#475569">Alcaldía de Montería • SIVICAP.</text>
    <text x="22" y="98" class="font-body" font-size="11" fill="#475569">Vigilancia de calidad de agua e IRCA.</text>
    <text x="22" y="118" class="font-mono" font-size="9.5" fill="#E11D48">[Auditoría Oficial Res. 2115/2007]</text>
  </g>

  <!-- ========================================================================
       PROCESO CENTRAL 0.0 (SISTEMA CIBERFÍSICO HYDROVIDRIAL)
       ======================================================================== -->
  <g transform="translate(540, 240)">
    <!-- Círculo Central con Sombra y Estilo Tech Clean -->
    <circle cx="180" cy="180" r="160" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" filter="url(#centerShadow)"/>
    <circle cx="180" cy="180" r="152" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5"/>

    <!-- Badge Proceso 0.0 -->
    <rect x="135" y="55" width="90" height="28" rx="14" fill="#0284C7"/>
    <text x="180" y="74" class="font-title" font-size="14" fill="#FFFFFF" text-anchor="middle">0.0</text>

    <!-- Título Proceso -->
    <text x="180" y="125" class="font-title" font-size="15" fill="#0C4A6E" text-anchor="middle">SISTEMA CIBERFÍSICO</text>
    <text x="180" y="148" class="font-title" font-size="15" fill="#0284C7" text-anchor="middle">HYDROVIDRIAL</text>

    <line x1="60" y1="168" x2="300" y2="168" stroke="#BAE6FD" stroke-width="1.5"/>

    <text x="180" y="195" class="font-body" font-size="11.5" fill="#334155" text-anchor="middle">
      Dosificación Hidráulica por Gravedad
    </text>
    <text x="180" y="215" class="font-body" font-size="11.5" fill="#334155" text-anchor="middle">
      + Optimización Cinética Arrhenius
    </text>
    <text x="180" y="235" class="font-body" font-size="11.5" fill="#334155" text-anchor="middle">
      + Gobernanza de Datos DAMA-DMBOK
    </text>

    <!-- Pill de Stack Tecnológico -->
    <rect x="75" y="258" width="210" height="26" rx="13" fill="#E0F2FE"/>
    <text x="180" y="275" class="font-mono" font-size="10.5" fill="#0369A1" text-anchor="middle">
      Python • Streamlit • PostgreSQL
    </text>
  </g>

  <!-- ========================================================================
       FLUJOS DE DATOS (CONEXIONES LIMPIAS CON PILLS DE TEXTO)
       ======================================================================== -->
  <!-- Flujo 1: EE-1 a 0.0 (Entrada de variables físicas) -->
  <path d="M 340 190 L 550 190 L 590 280" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <rect x="360" y="165" width="180" height="24" rx="6" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1" filter="url(#softShadow)"/>
  <text x="450" y="181" class="font-sub" font-size="9.5" fill="#0369A1" text-anchor="middle">Aforo L/s, T°C, DPD mg/L</text>

  <!-- Flujo 2: 0.0 a EE-1 (Salida: Instrucción de Calibración) -->
  <path d="M 570 340 L 490 340 L 490 250 L 340 250" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <rect x="360" y="280" width="180" height="24" rx="6" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1" filter="url(#softShadow)"/>
  <text x="450" y="296" class="font-sub" font-size="9.5" fill="#0369A1" text-anchor="middle">Vueltas Válvula, Alarmas</text>

  <!-- Flujo 3: 0.0 a EE-2 (Salida: Boletín a Comunidad) -->
  <path d="M 590 480 L 450 480 L 450 630 L 340 630" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <rect x="350" y="495" width="185" height="24" rx="6" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1" filter="url(#softShadow)"/>
  <text x="442" y="511" class="font-sub" font-size="9.5" fill="#0369A1" text-anchor="middle">Boletín Agua Potable • SMS</text>

  <!-- Flujo 4: EE-3 a 0.0 (Entrada: Parámetros y Constantes Cinéticas) -->
  <path d="M 1100 190 L 890 190 L 850 280" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <rect x="900" y="165" width="180" height="24" rx="6" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1" filter="url(#softShadow)"/>
  <text x="990" y="181" class="font-sub" font-size="9.5" fill="#0369A1" text-anchor="middle">Constante kd, Factor θ</text>

  <!-- Flujo 5: 0.0 a EE-3 (Salida: Telemetría y Dashboards) -->
  <path d="M 870 340 L 950 340 L 950 250 L 1100 250" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <rect x="900" y="280" width="180" height="24" rx="6" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1" filter="url(#softShadow)"/>
  <text x="990" y="296" class="font-sub" font-size="9.5" fill="#0369A1" text-anchor="middle">Telemetría, Indicadores ROI</text>

  <!-- Flujo 6: 0.0 a EE-4 (Salida: Reporte Epidemiológico SIVICAP) -->
  <path d="M 850 480 L 990 480 L 990 630 L 1100 630" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <rect x="900" y="495" width="185" height="24" rx="6" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1" filter="url(#softShadow)"/>
  <text x="992" y="511" class="font-sub" font-size="9.5" fill="#0369A1" text-anchor="middle">Boletín Oficial Res. 2115</text>

  <!-- ========================================================================
       TARJETA DE BALANCEO INFORMACIONAL
       ======================================================================== -->
  <g transform="translate(50, 775)">
    <rect x="0" y="0" width="1340" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow)"/>
    
    <rect x="30" y="18" width="260" height="24" rx="6" fill="#F0F9FF"/>
    <text x="40" y="34" class="font-sub" font-size="10" fill="#0369A1">BALANCEO DE INFORMACIÓN • NIVEL 0</text>

    <text x="30" y="65" class="font-title" font-size="13" fill="#0F172A">
      Entradas Formales (2): [Aforo Caudal Q1/Q2, Temp, DPD] desde EE-1 • [Parámetros Cinéticos kd, θ] desde EE-3
    </text>
    <text x="30" y="88" class="font-title" font-size="13" fill="#0F172A">
      Salidas Formales (4): [Instrucción Bypass, Alarmas] a EE-1 • [Boletín Potabilidad] a EE-2 • [Telemetría, ROI] a EE-3 • [Reporte SIVICAP] a EE-4
    </text>
    <text x="30" y="112" class="font-body" font-size="11.5" fill="#475569">
      Principio de Conservación de Datos: Ningún dato entra o sale del sistema sin estar mapeado a un proceso de cómputo y persistencia verificable.
    </text>

    <rect x="30" y="123" width="1280" height="18" rx="4" fill="#F8FAFC"/>
    <text x="45" y="136" class="font-mono" font-size="9.5" fill="#0284C7">
      [Consistencia Matemática: Nivel 0 balancea estrictamente 1:1 con el DFD Nivel 1 en subsistemas 1.0, 2.0, 3.0 y 4.0]
    </text>
  </g>
</svg>
