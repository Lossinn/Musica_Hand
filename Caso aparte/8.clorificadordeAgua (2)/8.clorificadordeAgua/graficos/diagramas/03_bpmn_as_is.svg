<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="100%" height="100%">
  <defs>
    <!-- Filtro de sombra suave estilo Stripe / Notion -->
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="alertShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#E11D48" flood-opacity="0.12"/>
    </filter>

    <!-- Marcadores de flecha limpios -->
    <marker id="arrowBpmn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1.5 1.5 L 7.5 4.5 L 1.5 7.5 Z" fill="#64748B"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1.5 1.5 L 7.5 4.5 L 1.5 7.5 Z" fill="#E11D48"/>
    </marker>
  </defs>

  <style>
    .font-title { font-family: 'Montserrat', system-ui, -apple-system, sans-serif; font-weight: 800; }
    .font-sub { font-family: 'Montserrat', system-ui, -apple-system, sans-serif; font-weight: 700; }
    .font-body { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 400; }
    .font-mono { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
  </style>

  <!-- Fondo Limpio y Suave -->
  <rect width="1440" height="960" fill="#F8FAFC"/>

  <!-- ========================================================================
       CABECERA TIPO NOTION / STRIPE
       ======================================================================== -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="1340" height="80" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow)"/>
    <path d="M 0 14 Q 0 0 14 0 L 14 80 Q 0 80 0 66 Z" fill="#E11D48"/>

    <text x="35" y="35" class="font-title" font-size="18" fill="#0F172A" letter-spacing="0.3">MODELADO DE PROCESOS BPMN 2.0 — PROCESO ACTUAL (AS-IS)</text>
    <text x="35" y="58" class="font-body" font-size="12" fill="#64748B">
      Desinfección Empírica, Identificación de Cuellos de Botella y Reprocesos • <tspan class="font-sub" fill="#0F172A">Vereda El Vidrial (Montería)</tspan>
    </text>

    <!-- Badge Autores & Estándar -->
    <rect x="940" y="21" width="375" height="38" rx="8" fill="#FFF1F2"/>
    <text x="955" y="44" class="font-body" font-size="11.5" fill="#9F1239">
      <tspan class="font-sub" fill="#BE123C">Estándar OMG BPMN 2.0</tspan> • EBT: Roxana • Andrea • Camilo
    </text>
  </g>

  <!-- ========================================================================
       POOL 1: COMUNIDAD DE EL VIDRIAL (PROCESO LOCAL AS-IS)
       ======================================================================== -->
  <g transform="translate(50, 130)">
    <!-- Contenedor Principal del Pool -->
    <rect x="0" y="0" width="1340" height="420" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#softShadow)"/>
    
    <!-- Banda Lateral del Pool -->
    <path d="M 0 14 Q 0 0 14 0 L 50 0 L 50 420 L 14 420 Q 0 420 0 406 Z" fill="#0F172A"/>
    <text x="-210" y="31" transform="rotate(-90)" class="font-title" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      POOL 1: COMUNIDAD EL VIDRIAL (AS-IS)
    </text>

    <!-- Línea divisoria de Carriles (Swimlanes) -->
    <line x1="50" y1="210" x2="1340" y2="210" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6 4"/>

    <!-- Cabecera Swimlane 1: Familia Rural -->
    <rect x="50" y="0" width="45" height="210" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="-105" y="78" transform="rotate(-90)" class="font-sub" font-size="10.5" fill="#475569" text-anchor="middle">
      LANE: FAMILIA RURAL
    </text>

    <!-- Cabecera Swimlane 2: Operador Empírico -->
    <rect x="50" y="210" width="45" height="210" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="-315" y="78" transform="rotate(-90)" class="font-sub" font-size="10.5" fill="#475569" text-anchor="middle">
      LANE: OPERADOR EMPÍRICO
    </text>

    <!-- ==================== ELEMENTOS EN SWIMLANE 1 ==================== -->
    <!-- Evento de Inicio -->
    <circle cx="150" cy="105" r="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.5"/>
    <circle cx="150" cy="105" r="7" fill="#16A34A"/>
    <text x="150" y="142" class="font-sub" font-size="10" fill="#0F172A" text-anchor="middle">Sospecha de Agua</text>
    <text x="150" y="156" class="font-body" font-size="9" fill="#64748B" text-anchor="middle">Contaminada</text>

    <line x1="172" y1="105" x2="220" y2="105" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowBpmn)"/>

    <!-- Tarea 1: Acarreo de Agua -->
    <g transform="translate(220, 72)">
      <rect x="0" y="0" width="150" height="66" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow)"/>
      <rect x="10" y="8" width="60" height="16" rx="4" fill="#F1F5F9"/>
      <text x="15" y="19" class="font-sub" font-size="8.5" fill="#475569">CAPTACIÓN</text>
      <text x="10" y="42" class="font-title" font-size="11" fill="#0F172A">Acarreo de Agua</text>
      <text x="10" y="57" class="font-body" font-size="9.5" fill="#64748B">Desde pozo artesiano</text>
    </g>

    <!-- Transición a Operador Empírico -->
    <path d="M 370 105 L 420 105 L 420 315 L 450 315" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrowBpmn)"/>

    <!-- ==================== ELEMENTOS EN SWIMLANE 2 ==================== -->
    <!-- Tarea 2: Compra de Cloro Genérico -->
    <g transform="translate(450, 282)">
      <rect x="0" y="0" width="160" height="66" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow)"/>
      <rect x="10" y="8" width="55" height="16" rx="4" fill="#F1F5F9"/>
      <text x="15" y="19" class="font-sub" font-size="8.5" fill="#475569">COMPRA</text>
      <text x="10" y="42" class="font-title" font-size="11" fill="#0F172A">Cloro Genérico 5.25%</text>
      <text x="10" y="57" class="font-body" font-size="9.5" fill="#64748B">Sin certificación sanitaria</text>
    </g>

    <line x1="610" y1="315" x2="660" y2="315" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowBpmn)"/>

    <!-- Tarea 3: Cuello de Botella 1 (Vaciado a Ojo) -->
    <g transform="translate(660, 275)">
      <rect x="0" y="0" width="180" height="80" rx="10" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="2" filter="url(#alertShadow)"/>
      <rect x="10" y="8" width="125" height="18" rx="4" fill="#FFE4E6"/>
      <text x="16" y="20" class="font-sub" font-size="9" fill="#9F1239">CUELLO DE BOTELLA 1</text>
      <text x="10" y="46" class="font-title" font-size="12" fill="#881337">Vaciado Empírico</text>
      <text x="10" y="62" class="font-body" font-size="10" fill="#9F1239">Vertimiento "a ojo" en tanque</text>
      <text x="10" y="74" class="font-mono" font-size="8.5" fill="#BE123C">Sin aforo ni cálculo de dosis</text>
    </g>

    <!-- Transición de vuelta a Familia Rural -->
    <path d="M 840 315 L 870 315 L 870 105 L 900 105" stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrowBpmn)"/>

    <!-- Compuerta 1: ¿Olor Insoportable? -->
    <g transform="translate(900, 85)">
      <polygon points="20,0 40,20 20,40 0,20" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
      <text x="20" y="25" class="font-title" font-size="14" fill="#D97706" text-anchor="middle">×</text>
      <text x="20" y="-12" class="font-sub" font-size="9.5" fill="#92400E" text-anchor="middle">¿Olor Insoportable?</text>
      <text x="20" y="-2" class="font-body" font-size="8.5" fill="#B45309" text-anchor="middle">(Sobredosificación)</text>
    </g>

    <!-- Rama SÍ: Reproceso y Descarte -->
    <path d="M 920 85 L 920 40 L 980 40" stroke="#E11D48" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
    <text x="930" y="55" class="font-sub" font-size="10" fill="#E11D48">Sí</text>

    <g transform="translate(980, 16)">
      <rect x="0" y="0" width="170" height="52" rx="8" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.5"/>
      <text x="10" y="24" class="font-title" font-size="10.5" fill="#9F1239">Descartar Agua y Lavar</text>
      <text x="10" y="40" class="font-body" font-size="9" fill="#BE123C">Reproceso + Compra forzada</text>
    </g>

    <!-- Rama NO: Consumo Domiciliario -->
    <line x1="940" y1="105" x2="980" y2="105" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowBpmn)"/>
    <text x="950" y="98" class="font-sub" font-size="10" fill="#15803D">No</text>

    <g transform="translate(980, 80)">
      <rect x="0" y="0" width="145" height="50" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow)"/>
      <text x="10" y="28" class="font-title" font-size="11" fill="#0F172A">Consumo Familiar</text>
      <text x="10" y="42" class="font-body" font-size="9.5" fill="#64748B">Ingesta en el hogar</text>
    </g>

    <line x1="1125" y1="105" x2="1160" y2="105" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowBpmn)"/>

    <!-- Compuerta 2: ¿Brote de Diarrea / EDA? -->
    <g transform="translate(1160, 85)">
      <polygon points="20,0 40,20 20,40 0,20" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
      <text x="20" y="25" class="font-title" font-size="14" fill="#D97706" text-anchor="middle">×</text>
      <text x="20" y="-12" class="font-sub" font-size="9.5" fill="#92400E" text-anchor="middle">¿Brote de EDA?</text>
      <text x="20" y="-2" class="font-body" font-size="8.5" fill="#B45309" text-anchor="middle">(Subdosificación)</text>
    </g>

    <!-- Rama NO: Riesgo Latente -->
    <line x1="1200" y1="105" x2="1245" y2="105" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowBpmn)"/>
    <text x="1210" y="98" class="font-sub" font-size="9.5" fill="#475569">No</text>
    
    <circle cx="1270" cy="105" r="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3"/>
    <text x="1270" y="132" class="font-sub" font-size="8.5" fill="#64748B" text-anchor="middle">Riesgo Latente</text>

    <!-- Rama SÍ: Conduce al Sector Salud Rural -->
    <path d="M 1180 125 L 1180 390" stroke="#E11D48" stroke-width="2.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
    <text x="1190" y="240" class="font-title" font-size="10.5" fill="#E11D48">Urgencia Médica (EDA)</text>
  </g>

  <!-- ========================================================================
       POOL 2: RED PÚBLICA DE SALUD RURAL (IMPACTO AS-IS)
       ======================================================================== -->
  <g transform="translate(50, 570)">
    <rect x="0" y="0" width="1340" height="175" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#softShadow)"/>
    
    <path d="M 0 14 Q 0 0 14 0 L 50 0 L 50 175 L 14 175 Q 0 175 0 161 Z" fill="#E11D48"/>
    <text x="-87" y="31" transform="rotate(-90)" class="font-title" font-size="11.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">
      POOL 2: ATENCIÓN CLÍNICA
    </text>

    <rect x="50" y="0" width="45" height="175" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="-87" y="78" transform="rotate(-90)" class="font-sub" font-size="10" fill="#475569" text-anchor="middle">
      PUESTO DE SALUD
    </text>

    <!-- Conexión entrante desde Pool 1 -->
    <path d="M 1180 0 L 1180 50 L 800 50 L 800 87" stroke="#E11D48" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>

    <!-- Tarea 4: Atención Médica -->
    <g transform="translate(710, 87)">
      <rect x="0" y="0" width="180" height="65" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow)"/>
      <rect x="10" y="8" width="60" height="16" rx="4" fill="#FEE2E2"/>
      <text x="16" y="20" class="font-sub" font-size="8.5" fill="#991B1B">URGENCIA</text>
      <text x="10" y="42" class="font-title" font-size="11" fill="#0F172A">Atención Clínica EDA</text>
      <text x="10" y="57" class="font-body" font-size="9.5" fill="#64748B">Rehidratación y antibióticos</text>
    </g>

    <line x1="710" y1="120" x2="620" y2="120" stroke="#E11D48" stroke-width="2" marker-end="url(#arrowRed)"/>

    <!-- Tarea 5: Cuello de Botella 2 (Gasto de Bolsillo Familiar) -->
    <g transform="translate(380, 77)">
      <rect x="0" y="0" width="240" height="75" rx="10" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="2" filter="url(#alertShadow)"/>
      <rect x="10" y="8" width="125" height="18" rx="4" fill="#FFE4E6"/>
      <text x="16" y="20" class="font-sub" font-size="9" fill="#9F1239">CUELLO DE BOTELLA 2</text>
      <text x="10" y="44" class="font-title" font-size="12" fill="#881337">Gasto de Bolsillo y Pérdida</text>
      <text x="10" y="59" class="font-body" font-size="10" fill="#9F1239">$120.000 COP promedio por episodio</text>
      <text x="10" y="70" class="font-mono" font-size="8.5" fill="#BE123C">Fármacos + Pasajes + Pérdida de jornal</text>
    </g>

    <!-- Fin Ciclo Crónico -->
    <line x1="380" y1="115" x2="310" y2="115" stroke="#E11D48" stroke-width="2" marker-end="url(#arrowRed)"/>
    <circle cx="280" cy="115" r="16" fill="#FEE2E2" stroke="#DC2626" stroke-width="3"/>
    <text x="280" y="145" class="font-sub" font-size="9" fill="#991B1B" text-anchor="middle">Trampa de Pobreza</text>
  </g>

  <!-- ========================================================================
       TARJETA DE SÍNTESIS DE INGENIERÍA
       ======================================================================== -->
  <g transform="translate(50, 770)">
    <rect x="0" y="0" width="1340" height="160" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow)"/>
    
    <rect x="30" y="20" width="230" height="26" rx="6" fill="#FFF1F2"/>
    <text x="40" y="37" class="font-sub" font-size="10.5" fill="#9F1239">DIAGNÓSTICO FORMAL DEL PROCESO AS-IS</text>

    <text x="30" y="70" class="font-title" font-size="13.5" fill="#0F172A">
      1. Dosificación arbitraria sin aforo hidrodinámico • 2. Ausencia metrológica de monitoreo DPD • 3. Elevado reproceso y rechazo
    </text>
    <text x="30" y="95" class="font-body" font-size="12" fill="#475569">
      El 100% de las familias de El Vidrial quedan expuestas a oscilaciones entre agua microbiológicamente peligrosa y agua tóxica con olor agresivo.
    </text>

    <!-- Badge Conclusión Res. 2115 -->
    <rect x="30" y="112" width="1280" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="45" y="134" class="font-mono" font-size="10.5" fill="#BE123C">
      [CONCLUSIÓN SILOGE: Proceso Inviable e Inconforme con la Resolución 2115 de 2007 • IRCA Rural Crónico > 65% • Requiere Reingeniería a Sistema Ciberfísico To-Be]
    </text>
  </g>
</svg>
