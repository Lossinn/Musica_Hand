<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Árbol de problemas" width="720" height="420"><rect width="720" height="420" fill="#fff"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff" stroke="#141414" stroke-width="1.2"/></marker><marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="3.6" fill="#fff" stroke="#141414" stroke-width="1.4"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B3261E"/></marker></defs><text x="360" y="14.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="700" fill="#404040">EFECTOS</text><rect x="0" y="30" width="168" height="84" rx="9" fill="#F5F5F5" stroke="#141414" stroke-width="1.8"/><text x="84.0" y="55.53" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="84.0" dy="0">Retroalimentación</tspan><tspan x="84.0" dy="16.47">tardía y abandono de</tspan><tspan x="84.0" dy="16.47">la práctica</tspan></text><path d="M84.0,186 L84.0,118" fill="none" stroke="#141414" stroke-width="1.8" marker-end="url(#arr)" stroke-linejoin="round"/><rect x="184" y="30" width="168" height="84" rx="9" fill="#F5F5F5" stroke="#141414" stroke-width="1.8"/><text x="268.0" y="47.295" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="268.0" dy="0">Acceso desigual a</tspan><tspan x="268.0" dy="16.47">una educación</tspan><tspan x="268.0" dy="16.47">musical con</tspan><tspan x="268.0" dy="16.47">seguimiento</tspan></text><path d="M268.0,186 L268.0,118" fill="none" stroke="#141414" stroke-width="1.8" marker-end="url(#arr)" stroke-linejoin="round"/><rect x="368" y="30" width="168" height="84" rx="9" fill="#F5F5F5" stroke="#141414" stroke-width="1.8"/><text x="452.0" y="55.53" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="452.0" dy="0">Docentes sin datos</tspan><tspan x="452.0" dy="16.47">objetivos para</tspan><tspan x="452.0" dy="16.47">decidir qué reforzar</tspan></text><path d="M452.0,186 L452.0,118" fill="none" stroke="#141414" stroke-width="1.8" marker-end="url(#arr)" stroke-linejoin="round"/><rect x="552" y="30" width="168" height="84" rx="9" fill="#F5F5F5" stroke="#141414" stroke-width="1.8"/><text x="636.0" y="55.53" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="636.0" dy="0">Olvido entre clases</tspan><tspan x="636.0" dy="16.47">por falta de repaso</tspan><tspan x="636.0" dy="16.47">programado</tspan></text><path d="M636.0,186 L636.0,118" fill="none" stroke="#141414" stroke-width="1.8" marker-end="url(#arr)" stroke-linejoin="round"/><text x="360" y="152.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="700" fill="#404040">PROBLEMA CENTRAL</text><rect x="0" y="186" width="720" height="70" rx="9" fill="#FFCC00" stroke="#141414" stroke-width="1.8"/><text x="360.0" y="202.7" font-size="15" text-anchor="middle" dominant-baseline="central" font-weight="700" fill="#141414"><tspan x="360.0" dy="0">Niños de 3 a 12 años de Montería aprenden las notas musicales sin</tspan><tspan x="360.0" dy="18.3">retroalimentación individual inmediata ni registro objetivo de su</tspan><tspan x="360.0" dy="18.3">progreso</tspan></text><text x="360" y="290.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="700" fill="#404040">CAUSAS</text><rect x="0" y="312" width="168" height="100" rx="9" fill="#fff" stroke="#141414" stroke-width="1.8"/><text x="84.0" y="345.53" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="84.0" dy="0">Atención docente de</tspan><tspan x="84.0" dy="16.47">uno a muchos en el</tspan><tspan x="84.0" dy="16.47">aula</tspan></text><path d="M84.0,312 L84.0,260" fill="none" stroke="#141414" stroke-width="1.8" marker-end="url(#arr)" stroke-linejoin="round"/><rect x="184" y="312" width="168" height="100" rx="9" fill="#fff" stroke="#141414" stroke-width="1.8"/><text x="268.0" y="345.53" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="268.0" dy="0">Evaluación manual y</tspan><tspan x="268.0" dy="16.47">subjetiva, sin</tspan><tspan x="268.0" dy="16.47">registro por nota</tspan></text><path d="M268.0,312 L268.0,260" fill="none" stroke="#141414" stroke-width="1.8" marker-end="url(#arr)" stroke-linejoin="round"/><rect x="368" y="312" width="168" height="100" rx="9" fill="#fff" stroke="#141414" stroke-width="1.8"/><text x="452.0" y="345.53" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="452.0" dy="0">Conectividad: 47,2 %</tspan><tspan x="452.0" dy="16.47">de los hogares de</tspan><tspan x="452.0" dy="16.47">Córdoba con internet</tspan></text><path d="M452.0,312 L452.0,260" fill="none" stroke="#141414" stroke-width="1.8" marker-end="url(#arr)" stroke-linejoin="round"/><rect x="552" y="312" width="168" height="100" rx="9" fill="#fff" stroke="#141414" stroke-width="1.8"/><text x="636.0" y="337.295" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="636.0" dy="0">Pocas herramientas</tspan><tspan x="636.0" dy="16.47">adaptativas sin nube</tspan><tspan x="636.0" dy="16.47">ni cuentas para</tspan><tspan x="636.0" dy="16.47">menores</tspan></text><path d="M636.0,312 L636.0,260" fill="none" stroke="#141414" stroke-width="1.8" marker-end="url(#arr)" stroke-linejoin="round"/></svg>