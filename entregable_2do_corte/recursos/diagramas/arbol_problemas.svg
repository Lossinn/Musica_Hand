<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Árbol de problemas" width="1400" height="800"><rect width="1400" height="800" fill="#fff"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff" stroke="#141414" stroke-width="1.2"/></marker><marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="3.6" fill="#fff" stroke="#141414" stroke-width="1.4"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B3261E"/></marker></defs><text x="700" y="28.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="700" fill="#404040">EFECTOS</text><rect x="20" y="50" width="320" height="92" rx="10" fill="#F5F5F5" stroke="#141414" stroke-width="1.8"/><text x="180.0" y="87.765" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="180.0" dy="0">Retroalimentación tardía y abandono de</tspan><tspan x="180.0" dy="16.47">la práctica musical</tspan></text><path d="M180,300 L180,147" fill="none" stroke="#141414" stroke-width="1.8" marker-end="url(#arr)" stroke-linejoin="round"/><rect x="365" y="50" width="320" height="92" rx="10" fill="#F5F5F5" stroke="#141414" stroke-width="1.8"/><text x="525.0" y="87.765" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="525.0" dy="0">Brecha de acceso a una educación musical</tspan><tspan x="525.0" dy="16.47">con seguimiento individual</tspan></text><path d="M525,300 L525,147" fill="none" stroke="#141414" stroke-width="1.8" marker-end="url(#arr)" stroke-linejoin="round"/><rect x="710" y="50" width="320" height="92" rx="10" fill="#F5F5F5" stroke="#141414" stroke-width="1.8"/><text x="870.0" y="87.765" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="870.0" dy="0">Docentes sin datos objetivos para</tspan><tspan x="870.0" dy="16.47">decidir qué reforzar</tspan></text><path d="M870,300 L870,147" fill="none" stroke="#141414" stroke-width="1.8" marker-end="url(#arr)" stroke-linejoin="round"/><rect x="1055" y="50" width="320" height="92" rx="10" fill="#F5F5F5" stroke="#141414" stroke-width="1.8"/><text x="1215.0" y="87.765" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="1215.0" dy="0">Olvido entre clases por falta de repaso</tspan><tspan x="1215.0" dy="16.47">programado</tspan></text><path d="M1215,300 L1215,147" fill="none" stroke="#141414" stroke-width="1.8" marker-end="url(#arr)" stroke-linejoin="round"/><rect x="20" y="300" width="1360" height="130" rx="10" fill="#FFCC00" stroke="#141414" stroke-width="1.8"/><text x="700.0" y="365.0" font-size="17" text-anchor="middle" dominant-baseline="central" font-weight="700" fill="#141414">Niños de 3 a 12 años de Montería aprenden las notas musicales sin retroalimentación individual inmediata ni registro objetivo de su progreso</text><text x="700" y="272.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="700" fill="#404040">PROBLEMA CENTRAL</text><text x="700" y="500.0" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="700" fill="#404040">CAUSAS</text><rect x="20" y="540" width="320" height="120" rx="10" fill="#fff" stroke="#141414" stroke-width="1.8"/><text x="180.0" y="591.765" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="180.0" dy="0">Atención docente de uno a muchos en el</tspan><tspan x="180.0" dy="16.47">aula de música</tspan></text><path d="M180,540 L180,435" fill="none" stroke="#141414" stroke-width="1.8" marker-end="url(#arr)" stroke-linejoin="round"/><rect x="365" y="540" width="320" height="120" rx="10" fill="#fff" stroke="#141414" stroke-width="1.8"/><text x="525.0" y="591.765" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="525.0" dy="0">Evaluación manual y subjetiva, sin</tspan><tspan x="525.0" dy="16.47">registro por nota</tspan></text><path d="M525,540 L525,435" fill="none" stroke="#141414" stroke-width="1.8" marker-end="url(#arr)" stroke-linejoin="round"/><rect x="710" y="540" width="320" height="120" rx="10" fill="#fff" stroke="#141414" stroke-width="1.8"/><text x="870.0" y="583.53" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="870.0" dy="0">Conectividad limitada: 47,2 % de los</tspan><tspan x="870.0" dy="16.47">hogares de Córdoba con internet (DANE,</tspan><tspan x="870.0" dy="16.47">2024)</tspan></text><path d="M870,540 L870,435" fill="none" stroke="#141414" stroke-width="1.8" marker-end="url(#arr)" stroke-linejoin="round"/><rect x="1055" y="540" width="320" height="120" rx="10" fill="#fff" stroke="#141414" stroke-width="1.8"/><text x="1215.0" y="583.53" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="1215.0" dy="0">Pocas herramientas adaptativas que</tspan><tspan x="1215.0" dy="16.47">funcionen sin nube ni cuentas para</tspan><tspan x="1215.0" dy="16.47">menores</tspan></text><path d="M1215,540 L1215,435" fill="none" stroke="#141414" stroke-width="1.8" marker-end="url(#arr)" stroke-linejoin="round"/><text x="700" y="717.68" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#404040" font-style="italic"><tspan x="700" dy="0">Las causas 1 y 2 se observan en el proceso actual (As-Is); la causa 3 proviene de la ENTIC Hogares 2024 del DANE; la causa 4 es la brecha identificada</tspan><tspan x="700" dy="14.64">en los 15 estudios revisados.</tspan></text></svg>