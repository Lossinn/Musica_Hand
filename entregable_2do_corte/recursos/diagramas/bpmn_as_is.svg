<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 705" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="BPMN 2.0 As-Is: enseñanza de una nota musical en una escuela de música" width="1400" height="705"><rect width="1400" height="705" fill="#fff"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141414"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fff" stroke="#141414" stroke-width="1.2"/></marker><marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="3.6" fill="#fff" stroke="#141414" stroke-width="1.4"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B3261E"/></marker></defs><rect x="10" y="10" width="1380" height="410" rx="0" fill="#fff" stroke="#141414" stroke-width="1.8"/><rect x="10" y="10" width="30" height="410" rx="0" fill="#F5F5F5" stroke="#141414" stroke-width="1.8"/><text x="25.0" y="215.0" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="700" fill="#141414" transform="rotate(-90 25.0 215.0)">Escuela de música</text><rect x="40" y="10" width="24" height="205" rx="0" fill="#fff" stroke="#141414" stroke-width="1.2"/><text x="52" y="112.5" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="600" fill="#141414" transform="rotate(-90 52 112.5)">Docente</text><line x1="40" y1="215" x2="1390" y2="215" stroke="#141414" stroke-width="1.2"/><rect x="40" y="215" width="24" height="205" rx="0" fill="#fff" stroke="#141414" stroke-width="1.2"/><text x="52" y="317.5" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="600" fill="#141414" transform="rotate(-90 52 317.5)">Niño o niña</text><circle cx="100" cy="125" r="15" fill="#fff" stroke="#141414" stroke-width="1.6"/><text x="100" y="159.9" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="100" dy="0">Inicia la</tspan><tspan x="100" dy="13.42">clase</tspan></text><rect x="180.0" y="94.0" width="120" height="62" rx="9" fill="#fff" stroke="#141414" stroke-width="1.6"/><text x="240" y="113.97" font-size="11.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="240" dy="0">Explica y</tspan><tspan x="240" dy="14.03">demuestra la</tspan><tspan x="240" dy="14.03">seña de la nota</tspan></text><circle cx="191.0" cy="103.0" r="3.2" fill="none" stroke="#141414" stroke-width="1.1"/><path d="M185.0,112.0 q6,-7 12,0" fill="none" stroke="#141414" stroke-width="1.1"/><rect x="370.0" y="94.0" width="140" height="62" rx="9" fill="#FBE9E7" stroke="#141414" stroke-width="1.6"/><text x="440" y="113.97" font-size="11.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="440" dy="0">Observa y corrige a</tspan><tspan x="440" dy="14.03">cada niño, uno por</tspan><tspan x="440" dy="14.03">uno</tspan></text><circle cx="381.0" cy="103.0" r="3.2" fill="none" stroke="#141414" stroke-width="1.1"/><path d="M375.0,112.0 q6,-7 12,0" fill="none" stroke="#141414" stroke-width="1.1"/><polygon points="600,99 626,125 600,151 574,125" fill="#fff" stroke="#141414" stroke-width="1.8"/><line x1="589.08" y1="114.08" x2="610.92" y2="135.92" stroke="#141414" stroke-width="2.4"/><line x1="589.08" y1="135.92" x2="610.92" y2="114.08" stroke="#141414" stroke-width="2.4"/><text x="600" y="169.9" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="600" fill="#141414">¿Acertó?</text><rect x="670.0" y="94.0" width="120" height="62" rx="9" fill="#FBE9E7" stroke="#141414" stroke-width="1.6"/><text x="730" y="120.985" font-size="11.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="730" dy="0">Anota el avance</tspan><tspan x="730" dy="14.03">en el cuaderno</tspan></text><circle cx="681.0" cy="103.0" r="3.2" fill="none" stroke="#141414" stroke-width="1.1"/><path d="M675.0,112.0 q6,-7 12,0" fill="none" stroke="#141414" stroke-width="1.1"/><rect x="815.0" y="94.0" width="150" height="62" rx="9" fill="#FBE9E7" stroke="#141414" stroke-width="1.6"/><text x="890" y="113.97" font-size="11.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="890" dy="0">Informa al acudiente</tspan><tspan x="890" dy="14.03">de forma verbal o por</tspan><tspan x="890" dy="14.03">mensaje</tspan></text><circle cx="826.0" cy="103.0" r="3.2" fill="none" stroke="#141414" stroke-width="1.1"/><path d="M820.0,112.0 q6,-7 12,0" fill="none" stroke="#141414" stroke-width="1.1"/><circle cx="1050" cy="125" r="15" fill="#fff" stroke="#141414" stroke-width="4"/><text x="1050" y="159.9" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="1050" dy="0">Fin de la</tspan><tspan x="1050" dy="13.42">clase</tspan></text><rect x="180.0" y="299.0" width="120" height="62" rx="9" fill="#fff" stroke="#141414" stroke-width="1.6"/><text x="240" y="325.985" font-size="11.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="240" dy="0">Imita la seña y</tspan><tspan x="240" dy="14.03">entona la nota</tspan></text><circle cx="191.0" cy="308.0" r="3.2" fill="none" stroke="#141414" stroke-width="1.1"/><path d="M185.0,317.0 q6,-7 12,0" fill="none" stroke="#141414" stroke-width="1.1"/><path d="M115,125 L180,125" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#arr)" stroke-linejoin="round"/><path d="M240,156 L240,299" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#arr)" stroke-linejoin="round"/><path d="M300,330 L440,330 L440,156" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#arr)" stroke-linejoin="round"/><path d="M510,125 L574,125" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#arr)" stroke-linejoin="round"/><path d="M626,125 L670,125" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#arr)" stroke-linejoin="round"/><text x="648" y="112.0" font-size="10.5" text-anchor="middle" dominant-baseline="central" font-weight="600" fill="#404040">Sí</text><path d="M600,99 L600,52 L240,52 L240,94" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#arr)" stroke-linejoin="round"/><text x="420" y="40.0" font-size="10.5" text-anchor="middle" dominant-baseline="central" font-weight="600" fill="#404040">No: se repite la demostración</text><path d="M790,125 L815,125" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#arr)" stroke-linejoin="round"/><path d="M965,125 L1035,125" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#arr)" stroke-linejoin="round"/><rect x="10" y="455" width="1380" height="150" rx="0" fill="#fff" stroke="#141414" stroke-width="1.8"/><rect x="10" y="455" width="30" height="150" rx="0" fill="#F5F5F5" stroke="#141414" stroke-width="1.8"/><text x="25.0" y="530.0" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="700" fill="#141414" transform="rotate(-90 25.0 530.0)">Acudiente</text><circle cx="890" cy="530" r="15" fill="#fff" stroke="#141414" stroke-width="1.6"/><rect x="882.5" y="524.6" width="15.0" height="10.799999999999999" fill="none" stroke="#141414" stroke-width="1.1"/><path d="M882.5,524.6 L890,530.375 L897.5,524.6" fill="none" stroke="#141414" stroke-width="1.1"/><text x="890" y="564.9" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="890" dy="0">Recibe</tspan><tspan x="890" dy="13.42">informe</tspan></text><rect x="965.0" y="499.0" width="150" height="62" rx="9" fill="#FBE9E7" stroke="#141414" stroke-width="1.6"/><text x="1040" y="518.97" font-size="11.5" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="1040" dy="0">Lee un informe sin</tspan><tspan x="1040" dy="14.03">detalle por nota ni</tspan><tspan x="1040" dy="14.03">evidencia</tspan></text><circle cx="976.0" cy="508.0" r="3.2" fill="none" stroke="#141414" stroke-width="1.1"/><path d="M970.0,517.0 q6,-7 12,0" fill="none" stroke="#141414" stroke-width="1.1"/><circle cx="1190" cy="530" r="15" fill="#fff" stroke="#141414" stroke-width="1.6"/><circle cx="1190" cy="530" r="11.5" fill="none" stroke="#141414" stroke-width="1.2"/><circle cx="1190" cy="530" r="8" fill="none" stroke="#141414" stroke-width="1.1"/><path d="M1190,523.5 L1190,530 L1193.6,532.4" fill="none" stroke="#141414" stroke-width="1.1"/><text x="1190" y="564.9" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="1190" dy="0">Hasta la</tspan><tspan x="1190" dy="13.42">próxima</tspan><tspan x="1190" dy="13.42">clase</tspan></text><circle cx="1310" cy="530" r="15" fill="#fff" stroke="#141414" stroke-width="4"/><text x="1310" y="564.9" font-size="11" text-anchor="middle" dominant-baseline="central" font-weight="500" fill="#141414"><tspan x="1310" dy="0">Sin repaso</tspan><tspan x="1310" dy="13.42">programado</tspan></text><path d="M905,530 L965,530" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#arr)" stroke-linejoin="round"/><path d="M1115,530 L1175,530" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#arr)" stroke-linejoin="round"/><path d="M1205,530 L1295,530" fill="none" stroke="#141414" stroke-width="1.5" marker-end="url(#arr)" stroke-linejoin="round"/><path d="M890,156 L890,515" fill="none" stroke="#141414" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrO)" marker-start="url(#dot)" stroke-linejoin="round"/><text x="898" y="300.0" font-size="10.5" text-anchor="start" dominant-baseline="central" font-weight="500" fill="#404040" font-style="italic">Informe verbal o mensaje</text><circle cx="510" cy="92" r="10.5" fill="#B3261E"/><text x="510" y="92.5" font-size="11.5" text-anchor="middle" dominant-baseline="central" font-weight="700" fill="#fff">1</text><circle cx="640" cy="100" r="10.5" fill="#B3261E"/><text x="640" y="100.5" font-size="11.5" text-anchor="middle" dominant-baseline="central" font-weight="700" fill="#fff">2</text><circle cx="786" cy="92" r="10.5" fill="#B3261E"/><text x="786" y="92.5" font-size="11.5" text-anchor="middle" dominant-baseline="central" font-weight="700" fill="#fff">3</text><circle cx="1115" cy="498" r="10.5" fill="#B3261E"/><text x="1115" y="498.5" font-size="11.5" text-anchor="middle" dominant-baseline="central" font-weight="700" fill="#fff">4</text><circle cx="1205" cy="498" r="10.5" fill="#B3261E"/><text x="1205" y="498.5" font-size="11.5" text-anchor="middle" dominant-baseline="central" font-weight="700" fill="#fff">5</text><rect x="10" y="617" width="1380" height="82" rx="6" fill="#FFF8F7" stroke="#B3261E" stroke-width="1.2" stroke-dasharray="5 3"/><text x="28" y="635.0" font-size="11.5" text-anchor="start" dominant-baseline="central" font-weight="500" fill="#141414">1  Atención individual 1:N: la corrección depende de la observación del docente.</text><text x="28" y="657.0" font-size="11.5" text-anchor="start" dominant-baseline="central" font-weight="500" fill="#141414">2  Criterio de acierto subjetivo: no se miden latencia, confianza ni confusiones entre notas.</text><text x="28" y="679.0" font-size="11.5" text-anchor="start" dominant-baseline="central" font-weight="500" fill="#141414">3  Registro manual en cuaderno: los datos no se agregan ni se consultan por habilidad.</text><text x="718" y="635.0" font-size="11.5" text-anchor="start" dominant-baseline="central" font-weight="500" fill="#141414">4  Retroalimentación tardía al acudiente, sin detalle por nota ni evidencia del avance.</text><text x="718" y="657.0" font-size="11.5" text-anchor="start" dominant-baseline="central" font-weight="500" fill="#141414">5  Sin repaso espaciado: el olvido entre clases no se mide ni se programa.</text></svg>